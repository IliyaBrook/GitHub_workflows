# Copy this file into .github/workflows/global-workflows.yml.
# Delete or comment out any jobs you do not want to use.
#
# Repository secrets are configured in the target repository:
# Settings -> Secrets and variables -> Actions -> Repository secrets.
#
# OpenClaw responder values are workflow inputs, not GitHub secrets. They point
# to files and endpoints on the self-hosted runner / OpenClaw server.
name: Telegram / Stale Issues / Claude Triage / OpenClaw

on:
  issues:
    types: [opened, labeled, closed]
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]
  discussion:
    types: [created]
  discussion_comment:
    types: [created]
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  # Job: Telegram notifications for Issues, PRs, Issue comments, Discussions,
  # and Discussion comments.
  #
  # Required target repository secrets:
  # - TELEGRAM_TOKEN: bot token from BotFather.
  #   Example: 123456789:AA... from BotFather.
  # - TELEGRAM_CHAT_ID: target user/group/chat id, not the bot id.
  #   Example for a private chat: 405524524.
  #
  # No self-hosted runner is required; this job runs on GitHub-hosted runners.
  telegram-notifications:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    uses: IliyaBrook/GitHub_workflows/.github/workflows/telegram-notify.yml@master
    secrets: inherit

  # Job: mark inactive Issues/PRs stale and close them later.
  #
  # Required target repository secrets: none.
  #
  # Required permissions:
  # - issues: write
  # - pull-requests: write
  #
  # Runs only on the schedule above or manual workflow_dispatch.
  stale-issues:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      issues: write
      pull-requests: write
    uses: IliyaBrook/GitHub_workflows/.github/workflows/stale-issues.yml@master
    secrets: inherit

  # Job: Claude-powered issue triage for newly opened Issues.
  #
  # Required target repository secrets:
  # - CLAUDE_CODE_OAUTH_TOKEN: generated by `claude setup-token`.
  # - TELEGRAM_TOKEN: optional only if you want the triage summary in Telegram.
  # - TELEGRAM_CHAT_ID: optional only if you want the triage summary in Telegram.
  #
  # If you do not use Claude, delete or comment out this whole job.
  claude-issue-triage:
    if: github.event_name == 'issues' && github.event.action == 'opened'
    permissions:
      contents: read
      issues: write
      id-token: write
    uses: IliyaBrook/GitHub_workflows/.github/workflows/claude-issue-triage.yml@master
    secrets: inherit

  # Job: OpenClaw code-aware responder for Issues and Issue comments.
  #
  # Required target repository secrets: none.
  #
  # Required target repository setup:
  # - Self-hosted runner available to this repository.
  # - Assistant GitHub account can read/comment on this repository.
  #
  # Required files/settings on the self-hosted runner / OpenClaw server:
  # - responder-script: absolute path to the installed wrapper.
  #   Example: /opt/openclaw/bin/openclaw-github-responder
  # - hook-url: local OpenClaw hook endpoint reachable from the runner host.
  #   Example: http://127.0.0.1:18789/hooks/agent
  # - hook-token-file: local file containing the same token as OpenClaw hooks.token.
  #   Example: /opt/openclaw/secrets/github-hook-token
  # - runner-labels: labels that match your self-hosted runner.
  #   Example: '["self-hosted","openclaw"]'
  openclaw-issue-responder:
    if: github.event_name == 'issues' || github.event_name == 'issue_comment'
    permissions:
      contents: read
      issues: read
    uses: IliyaBrook/GitHub_workflows/.github/workflows/openclaw-issue-responder.yml@master
    with:
      runner-labels: '["self-hosted","openclaw"]'
      responder-script: /opt/openclaw/bin/openclaw-github-responder
      bot-login: brooks-assistant
      approved-actor-logins: IliyaBrook
      assistant-name: OpenClaw Assistant
      hook-url: http://127.0.0.1:18789/hooks/agent
      hook-token-file: /opt/openclaw/secrets/github-hook-token
      staging-update-command: cd /home/brooks-server/actions-runner-caminopack/_work/CaminoPack/CaminoPack && git fetch origin master && git checkout master && git pull --ff-only origin master && docker compose up -d --build backend-staging frontend-staging

  # Job: OpenClaw code-aware responder for Discussions and Discussion comments.
  #
  # Required target repository secrets: none.
  #
  # Required target repository setup:
  # - GitHub Discussions enabled in this repository.
  # - Self-hosted runner available to this repository.
  # - Assistant GitHub account can read/comment on Discussions.
  #
  # Required files/settings on the self-hosted runner / OpenClaw server:
  # - responder-script: absolute path to the installed wrapper.
  #   Example: /opt/openclaw/bin/openclaw-github-responder
  # - hook-url: local OpenClaw hook endpoint reachable from the runner host.
  #   Example: http://127.0.0.1:18789/hooks/agent
  # - hook-token-file: local file containing the same token as OpenClaw hooks.token.
  #   Example: /opt/openclaw/secrets/github-hook-token
  # - runner-labels: labels that match your self-hosted runner.
  #   Example: '["self-hosted","openclaw"]'
  openclaw-discussion-responder:
    if: github.event_name == 'discussion' || github.event_name == 'discussion_comment'
    permissions:
      contents: read
      discussions: read
    uses: IliyaBrook/GitHub_workflows/.github/workflows/openclaw-discussion-responder.yml@master
    with:
      runner-labels: '["self-hosted","openclaw"]'
      responder-script: /opt/openclaw/bin/openclaw-github-responder
      bot-login: brooks-assistant
      approved-actor-logins: IliyaBrook
      assistant-name: OpenClaw Assistant
      hook-url: http://127.0.0.1:18789/hooks/agent
      hook-token-file: /opt/openclaw/secrets/github-hook-token
      staging-update-command: cd /home/brooks-server/actions-runner-caminopack/_work/CaminoPack/CaminoPack && git fetch origin master && git checkout master && git pull --ff-only origin master && docker compose up -d --build backend-staging frontend-staging
