# Copy this file into .github/workflows/global-workflows.yml and delete or
# comment out jobs you do not want to use.
name: Telegram / Stale Issues / Claude Triage / OpenClaw

on:
  issues:
    types: [opened, labeled, closed]
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]
  discussion:
    types: [created]
  discussion_comment:
    types: [created]
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  # Requires repository secrets:
  # - TELEGRAM_TOKEN: bot token from BotFather.
  # - TELEGRAM_CHAT_ID: target user/group/chat id, not the bot id.
  telegram-notifications:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    uses: IliyaBrook/GitHub_workflows/.github/workflows/telegram-notify.yml@master
    secrets: inherit

  # No secrets required. Runs on the schedule above or manual workflow_dispatch.
  stale-issues:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      issues: write
      pull-requests: write
    uses: IliyaBrook/GitHub_workflows/.github/workflows/stale-issues.yml@master
    secrets: inherit

  # Requires repository secret:
  # - CLAUDE_CODE_OAUTH_TOKEN: generated by `claude setup-token`.
  claude-issue-triage:
    if: github.event_name == 'issues' && github.event.action == 'opened'
    permissions:
      contents: read
      issues: write
      id-token: write
    uses: IliyaBrook/GitHub_workflows/.github/workflows/claude-issue-triage.yml@master
    secrets: inherit

  # Requires:
  # - A self-hosted runner reachable by the labels below.
  # - openclaw/openclaw-github-responder installed on that runner host.
  # - OpenClaw hooks enabled on the runner host.
  # - hook-token-file containing the same token as OpenClaw hooks.token.
  # - The assistant GitHub account must be able to comment on this repository.
  openclaw-issue-responder:
    if: github.event_name == 'issues' || github.event_name == 'issue_comment'
    permissions:
      contents: read
      issues: read
    uses: IliyaBrook/GitHub_workflows/.github/workflows/openclaw-issue-responder.yml@master
    with:
      runner-labels: '["self-hosted","openclaw"]'
      responder-script: /opt/openclaw/bin/openclaw-github-responder
      bot-login: brooks-assistant
      assistant-name: OpenClaw Assistant
      hook-url: http://127.0.0.1:18789/hooks/agent
      hook-token-file: /opt/openclaw/secrets/github-hook-token

  # Same requirements as openclaw-issue-responder.
  # This job answers GitHub Discussions and Discussion comments.
  openclaw-discussion-responder:
    if: github.event_name == 'discussion' || github.event_name == 'discussion_comment'
    permissions:
      contents: read
      discussions: read
    uses: IliyaBrook/GitHub_workflows/.github/workflows/openclaw-discussion-responder.yml@master
    with:
      runner-labels: '["self-hosted","openclaw"]'
      responder-script: /opt/openclaw/bin/openclaw-github-responder
      bot-login: brooks-assistant
      assistant-name: OpenClaw Assistant
      hook-url: http://127.0.0.1:18789/hooks/agent
      hook-token-file: /opt/openclaw/secrets/github-hook-token
