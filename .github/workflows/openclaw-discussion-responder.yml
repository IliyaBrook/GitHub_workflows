name: OpenClaw Discussion Responder

on:
  workflow_call:
    inputs:
      runner-labels:
        description: JSON array of self-hosted runner labels.
        required: false
        type: string
        default: '["self-hosted","openclaw"]'
      responder-script:
        description: Absolute path to openclaw-github-responder on the runner host.
        required: false
        type: string
        default: /opt/openclaw/bin/openclaw-github-responder
      bot-login:
        description: GitHub login used by the assistant bot; events from this actor are skipped.
        required: false
        type: string
        default: brooks-assistant
      assistant-name:
        description: Public assistant name used in the prompt.
        required: false
        type: string
        default: OpenClaw Assistant
      hook-url:
        description: Local OpenClaw hook endpoint reachable from the runner host.
        required: false
        type: string
        default: http://127.0.0.1:18789/hooks/agent
      hook-token-file:
        description: File containing the OpenClaw hook token on the runner host.
        required: false
        type: string
        default: /opt/openclaw/secrets/github-hook-token
      approved-actor-logins:
        description: Comma-separated GitHub logins allowed to approve code-changing runs.
        required: false
        type: string
        default: IliyaBrook
      staging-update-command:
        description: Optional command to run after a successful approved code change.
        required: false
        type: string
        default: ''
      timeout-minutes:
        description: Maximum job runtime.
        required: false
        type: number
        default: 60

permissions:
  contents: read
  discussions: read

concurrency:
  group: openclaw-discussion-${{ github.event.discussion.node_id || github.run_id }}
  cancel-in-progress: false

jobs:
  respond:
    if: github.actor != inputs.bot-login
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Wake ${{ inputs.assistant-name }}
        env:
          OPENCLAW_ASSISTANT_NAME: ${{ inputs.assistant-name }}
          OPENCLAW_BOT_LOGIN: ${{ inputs.bot-login }}
          OPENCLAW_APPROVED_ACTOR_LOGINS: ${{ inputs.approved-actor-logins }}
          OPENCLAW_HOOK_TOKEN_FILE: ${{ inputs.hook-token-file }}
          OPENCLAW_HOOK_URL: ${{ inputs.hook-url }}
          OPENCLAW_STAGING_UPDATE_COMMAND: ${{ inputs.staging-update-command }}
        run: '"${{ inputs.responder-script }}" "$GITHUB_EVENT_PATH" "$GITHUB_WORKSPACE"'
